<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fantasy Lighting Time Card</title>
<meta name="theme-color" content="#1f1a2e">
<meta name="color-scheme" content="light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Time Card">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<style>
  :root {
    --night: #1f1a2e;
    --night-soft: #352d4a;
    --glow: #f4b740;
    --glow-soft: #fdf0d2;
    --ink: #2a2433;
    --muted: #665f70;
    --paper: #f8f5ef;
    --card: #ffffff;
    --line: #dcd6cb;
    --danger: #a32a1f;
    --danger-soft: #fbeae7;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 18px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  [hidden] { display: none !important; }

  header {
    background: var(--night);
    color: #fff;
    padding: calc(16px + env(safe-area-inset-top)) 20px 0;
  }
  .header-inner { max-width: 880px; margin: 0 auto; }
  main { max-width: 920px; margin: 0 auto; }
  .brand { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 12px; padding-bottom: 14px; }
  .brand strong { font: 600 26px/1.2 "Iowan Old Style", Palatino, Georgia, serif; color: var(--glow); }
  .brand span { color: #d9d4e4; }
  #lang-btn {
    margin-left: auto;
    min-height: 48px;
    padding: 0 18px;
    border: 2px solid var(--glow);
    border-radius: 10px;
    background: transparent;
    color: var(--glow);
    font-weight: 700;
    cursor: pointer;
  }
  nav { display: flex; gap: 4px; overflow-x: auto; }
  nav button {
    flex: 0 0 auto;
    min-height: 50px;
    padding: 0 18px;
    border: 0;
    border-radius: 10px 10px 0 0;
    background: transparent;
    color: #d9d4e4;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  nav button[aria-current="page"] { background: var(--paper); color: var(--ink); }

  main { padding: 20px 20px calc(48px + env(safe-area-inset-bottom)); }
  h1 { margin: 0 0 14px; font-size: 24px; line-height: 1.25; }
  h2 { margin: 0 0 10px; font-size: 19px; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px;
    margin-bottom: 18px;
  }
  .card > p:first-child { margin-top: 0; }
  .muted { color: var(--muted); font-size: 16px; }
  .banner {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px 14px;
    margin: 0 0 16px;
    padding: 12px 14px;
    border-radius: 10px;
    background: var(--danger-soft);
    color: var(--danger);
    font-weight: 600;
  }
  .banner span { flex: 1 1 260px; }

  button { font: inherit; }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 48px;
    padding: 0 18px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--card);
    color: var(--ink);
    font-weight: 600;
    cursor: pointer;
  }
  .btn.primary { background: var(--night); border-color: var(--night); color: #fff; }
  .btn.danger { color: var(--danger); }
  .btn.small { min-height: 44px; padding: 0 14px; font-size: 16px; }
  .btn:disabled { opacity: .45; cursor: default; }
  :focus-visible { outline: 3px solid var(--glow); outline-offset: 2px; }

  fieldset { border: 0; margin: 0 0 18px; padding: 0; min-width: 0; }
  legend, label.field > span { display: block; padding: 0; margin-bottom: 6px; font-weight: 600; }
  .names { display: flex; flex-wrap: wrap; gap: 10px; }
  .names label { position: relative; }
  .names input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
  .names span {
    display: flex;
    align-items: center;
    min-height: 56px;
    padding: 0 22px;
    border: 2px solid var(--line);
    border-radius: 12px;
    background: var(--card);
    font-weight: 600;
  }
  .names input:checked + span { background: var(--glow); border-color: var(--glow); color: #231a05; }
  .names input:focus-visible + span { outline: 3px solid var(--night); outline-offset: 2px; }

  .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 16px; align-items: end; }
  .pin-field { display: block; max-width: 220px; margin-bottom: 18px; }
  input[type="date"], input[type="time"], input[type="number"], input[type="text"], select {
    display: block;
    width: 100%;
    min-width: 0;
    min-height: 54px;
    padding: 8px 12px;
    border: 1px solid #a9a29a;
    border-radius: 10px;
    background: #fff;
    color: var(--ink);
    font: inherit;
    -webkit-appearance: none;
    appearance: none;
  }
  select { -webkit-appearance: auto; appearance: auto; }
  /* A plain text box showing dots, because a real password box makes the iPad offer to save the PIN. */
  input.pin { -webkit-text-security: disc; letter-spacing: .3em; font-size: 22px; }
  .preview {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 2px 10px;
    margin: 18px 0;
    padding: 12px 14px;
    border-radius: 10px;
    background: var(--glow-soft);
    min-height: 54px;
  }
  .preview strong { font-size: 24px; font-variant-numeric: tabular-nums; }
  .form-error { margin: 0 0 14px; color: var(--danger); font-weight: 600; }
  .form-actions { display: flex; flex-wrap: wrap; gap: 10px; }
  .form-actions .primary { flex: 1 1 220px; min-height: 58px; font-size: 20px; }

  .week-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 16px; }
  .week-bar h1 { margin: 0 auto 0 0; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { padding: 10px 8px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; white-space: normal; min-width: 110px; font-weight: 600; }
  thead th { font-size: 15px; color: var(--muted); font-weight: 600; }
  tfoot td { border-bottom: 0; font-weight: 700; }
  .total-col { font-weight: 700; background: var(--glow-soft); }
  td.zero { color: #a29ba8; }

  .day-title { margin: 18px 0 6px; font-size: 16px; color: var(--muted); font-weight: 600; }
  .day-title:first-of-type { margin-top: 0; }
  .entry {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px 14px;
    padding: 10px 0;
    border-top: 1px solid var(--line);
  }
  .entry-main { flex: 1 1 240px; min-width: 0; }
  .entry-name { font-weight: 600; overflow-wrap: anywhere; }
  .entry-hours { font-weight: 700; font-variant-numeric: tabular-nums; }
  .entry-actions { display: flex; gap: 8px; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }

  /* A plain overlay rather than the built-in dialog box, which iPads on iOS 15.3 or older don't have. */
  .modal-bg {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    left: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: rgba(20, 16, 30, .55);
  }
  .modal {
    width: 100%;
    max-width: 460px;
    max-height: 100%;
    overflow-y: auto;
    border-radius: var(--radius);
    padding: 20px;
    background: var(--card);
    color: var(--ink);
  }
  .modal p { margin: 0 0 14px; white-space: pre-line; }
  .modal input { margin-bottom: 16px; }
  /* OK comes first in the page order so the keyboard's Go key means OK, and is drawn on the right. */
  .dialog-actions { display: flex; flex-direction: row-reverse; flex-wrap: wrap; gap: 10px; }

  /* Safari before 14.1 ignores gap between flexbox items, so these get real margins there instead. */
  .no-flex-gap .names > *,
  .no-flex-gap .actions > *,
  .no-flex-gap .form-actions > *,
  .no-flex-gap .week-bar > *,
  .no-flex-gap .entry > *,
  .no-flex-gap .entry-actions > *,
  .no-flex-gap .banner > * { margin: 0 10px 10px 0; }
  .no-flex-gap .dialog-actions > * { margin: 0 0 10px 10px; }
  .no-flex-gap nav > * { margin-right: 4px; }
  .no-flex-gap .brand > * { margin-right: 12px; }
  .no-flex-gap .preview > * { margin-right: 10px; }
  .no-flex-gap #lang-btn { margin-right: 0; }
  .no-flex-gap .week-bar h1 { margin: 0 auto 10px 0; }

  #toast {
    position: fixed;
    left: 50%;
    bottom: calc(20px + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    max-width: calc(100vw - 32px);
    padding: 12px 18px;
    border-radius: 10px;
    background: var(--night);
    color: #fff;
    font-weight: 600;
    text-align: center;
  }
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="brand">
      <strong>Fantasy Lighting</strong><span data-t="appName"></span>
      <button type="button" id="lang-btn"></button>
    </div>
    <nav aria-label="Pages" id="main-nav">
      <button type="button" data-page="log" data-t="navLog" aria-current="page"></button>
      <button type="button" data-page="week" data-t="navWeek"></button>
      <button type="button" data-page="settings" data-t="navSettings"></button>
    </nav>
  </div>
</header>

<main>
  <div class="banner" id="status-banner" role="alert" hidden>
    <span id="status-text"></span>
    <button type="button" class="btn small" id="status-retry" data-t="tryAgain"></button>
  </div>

  <section id="page-connect" hidden>
    <h1 data-t="connectTitle"></h1>
    <div class="card" id="connect-missing" hidden>
      <p data-t="connectMissing"></p>
    </div>
    <form class="card" id="connect-form" novalidate>
      <p data-t="connectIntro"></p>
      <label class="field"><span data-t="accessCode"></span><input type="text" id="connect-code" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABCD-1234-EF56"></label>
      <p class="form-error" id="connect-error" role="alert" hidden style="margin-top:14px"></p>
      <div class="actions"><button type="submit" class="btn primary" id="connect-btn" data-t="connect"></button></div>
    </form>
  </section>

  <section id="page-log" hidden>
    <h1 id="log-title"></h1>
    <form id="entry-form" class="card" novalidate>
      <div id="names-message" hidden>
        <p id="names-message-text"></p>
        <button type="button" class="btn" id="names-check" data-t="checkAgain"></button>
      </div>
      <div id="form-fields">
        <fieldset>
          <legend data-t="yourName"></legend>
          <div class="names" id="name-choices"></div>
        </fieldset>
        <label class="field pin-field"><span data-t="yourPin"></span><input type="text" class="pin" id="f-pin" inputmode="numeric" maxlength="4" autocomplete="off" autocorrect="off" spellcheck="false"></label>
        <div class="form-grid">
          <label class="field"><span data-t="date"></span><input type="date" id="f-date"></label>
          <label class="field"><span data-t="startTime"></span><input type="time" id="f-start"></label>
          <label class="field"><span data-t="endTime"></span><input type="time" id="f-end"></label>
        </div>
        <p class="muted" data-t="paidNote" style="margin:12px 0 0"></p>
        <div class="preview" aria-live="polite"><strong id="preview-hours">–</strong><span id="preview-note" class="muted"></span></div>
        <p class="form-error" id="form-error" role="alert" hidden></p>
        <div class="form-actions">
          <button type="submit" class="btn primary" id="save-btn"></button>
          <button type="button" class="btn" id="cancel-edit" data-t="cancel" hidden></button>
        </div>
      </div>
    </form>
  </section>

  <section id="page-week" hidden>
    <div class="week-bar">
      <h1 id="week-title"></h1>
      <button type="button" class="btn small" id="week-prev" data-t="previous"></button>
      <button type="button" class="btn small" id="week-now" data-t="thisWeek"></button>
      <button type="button" class="btn small" id="week-next" data-t="next"></button>
    </div>
    <p class="form-error" id="week-bad-rows" role="alert" hidden></p>
    <div class="card">
      <h2 data-t="totals"></h2>
      <div class="table-wrap" id="week-totals"></div>
      <div class="actions">
        <button type="button" class="btn primary" id="export-week" data-t="exportWeek"></button>
      </div>
      <p class="muted" id="export-note" data-t="exportNotHere" style="margin:12px 0 0" hidden></p>
    </div>
    <div class="card">
      <h2 data-t="allEntries"></h2>
      <div id="week-entries"></div>
    </div>
  </section>

  <section id="page-settings" hidden>
    <h1 data-t="navSettings"></h1>
    <div class="card">
      <h2 data-t="namesAndPins"></h2>
      <p class="muted" data-t="namesAndPinsHelp"></p>
      <p id="people-summary"></p>
    </div>
    <div class="card">
      <h2 data-t="payWeek"></h2>
      <label class="field"><span data-t="weekStartsOn"></span><select id="week-start"></select></label>
    </div>
    <div class="card">
      <h2 data-t="connectionTitle"></h2>
      <p class="muted" data-t="connectionHelp"></p>
      <div class="actions"><button type="button" class="btn" id="disconnect-btn" data-t="disconnect"></button></div>
    </div>
  </section>
</main>

<div class="modal-bg" id="dialog" hidden>
  <form class="modal" id="dialog-form" role="dialog" aria-modal="true" aria-labelledby="dialog-message" novalidate>
    <p id="dialog-message"></p>
    <input type="text" class="pin" id="dialog-pin" aria-labelledby="dialog-message" inputmode="numeric" maxlength="4" autocomplete="off" autocorrect="off" spellcheck="false" hidden>
    <div class="dialog-actions">
      <button type="submit" class="btn primary" id="dialog-ok">OK</button>
      <button type="button" class="btn" id="dialog-cancel" data-t="cancel"></button>
    </div>
  </form>
</div>
<div id="toast" role="status" hidden></div>

let lang = 'en';
let state = { people: [], entries: [], badRows: [], loaded: false, loadedAt: 0 };
let weekStart = 0;
let accessCode = '';
let editingId = null;
// Always 0 for new entries. A manager can still record a break on the Hours tab, and editing that entry keeps it.
let editingBreak = 0;
let pendingSave = null;
let saving = false;
let loading = false;
let viewWeek = null;
let lastSeenDay = null;
let toastTimer = null;

const $ = id => document.getElementById(id);

// ---- Language ----
function t(key, values) {
  let text = TEXT[lang][key];
  Object.keys(values || {}).forEach(name => { text = text.split('{' + name + '}').join(values[name]); });
  return text;
}
function applyLanguage() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t(el.dataset.t); });
  $('lang-btn').textContent = TEXT[lang].switchTo;
  $('lang-btn').lang = lang === 'en' ? 'es' : 'en';
  $('log-title').textContent = t(editingId ? 'editTitle' : 'logTitle');
  $('save-btn').textContent = t(saving ? 'saving' : (editingId ? 'saveChanges' : 'saveHours'));
  ['form-error', 'connect-error'].forEach(id => showError(id, ''));
  renderNameChoices();
  updatePreview();
  if (!$('page-week').hidden) renderWeek();
  if (!$('page-settings').hidden) renderSettings();
  if (!$('status-banner').hidden) refresh();
}

// ---- Small helpers ----
function esc(value) {
  return String(value).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
}
function pad(n) {
  return String(n).padStart(2, '0');
}
// Dates are plain YYYY-MM-DD in local time, so an evening entry never slips to the next day.
function toDateStr(d) {
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
}
function parseDate(s) {
  const [y, m, d] = s.split('-').map(Number);
  return new Date(y, m - 1, d);
}
function addDays(d, days) {
  return new Date(d.getFullYear(), d.getMonth(), d.getDate() + days);
}
function weekStartOf(d) {
  return addDays(d, -((d.getDay() - weekStart + 7) % 7));
}
function toMinutes(time) {
  const [h, m] = time.split(':').map(Number);
  return h * 60 + m;
}
// An end time earlier than the start time means the shift ran past midnight.
function shiftMinutes(start, end) {
  const span = toMinutes(end) - toMinutes(start);
  return span < 0 ? span + 1440 : span;
}
function workedMinutes(entry) {
  return shiftMinutes(entry.start, entry.end) - entry.breakMin;
}
// Totals add up minutes and convert at the end, so rounded rows can't drift the total.
function fmtHours(minutes) {
  return (minutes / 60).toFixed(2);
}
function fmtTime(time) {
  const [h, m] = time.split(':').map(Number);
  return (h % 12 || 12) + ':' + pad(m) + (h < 12 ? ' AM' : ' PM');
}
function fmtDay(d) {
  return d.toLocaleDateString(t('locale'), { weekday: 'long', month: 'long', day: 'numeric' });
}
function fmtRange(start, locale) {
  const end = addDays(start, 6);
  const short = d => d.toLocaleDateString(locale, { month: 'short', day: 'numeric' });
  return short(start) + ' – ' + short(end) + ', ' + end.getFullYear();
}
function byDateThenTime(a, b) {
  return a.date.localeCompare(b.date) || a.start.localeCompare(b.start) || a.name.localeCompare(b.name);
}
function toast(message) {
  const el = $('toast');
  el.textContent = message;
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, 4000);
}
function showError(id, message) {
  $(id).textContent = message || '';
  $(id).hidden = !message;
}
function readStored(key) {
  try { return localStorage.getItem(key); } catch (e) { return null; }
}
function writeStored(key, value) {
  try {
    if (value === null) localStorage.removeItem(key);
    else localStorage.setItem(key, value);
  } catch (e) {}
}

// Stands in for confirm() and prompt(), which aren't dependable in an app opened from the iPad home screen.
// With wantsPin it resolves to the typed PIN, or null if cancelled. Otherwise it resolves to true or false.
function ask(message, okLabel, wantsPin) {
  return new Promise(resolve => {
    const input = $('dialog-pin');
    const returnFocusTo = document.activeElement;
    const finish = ok => {
      $('dialog').hidden = true;
      $('dialog-form').onsubmit = null;
      $('dialog-cancel').onclick = null;
      $('dialog').onkeydown = null;
      const pin = input.value;
      input.value = '';
      if (returnFocusTo && returnFocusTo.focus) returnFocusTo.focus();
      resolve(wantsPin ? (ok ? pin : null) : ok);
    };
    $('dialog-form').onsubmit = event => {
      event.preventDefault();
      finish(true);
    };
    $('dialog-cancel').onclick = () => finish(false);
    $('dialog').onkeydown = event => {
      if (event.key === 'Escape') finish(false);
    };
    $('dialog-message').textContent = message;
    $('dialog-ok').textContent = okLabel;
    input.hidden = !wantsPin;
    input.value = '';
    $('dialog').hidden = false;
    (wantsPin ? input : $('dialog-ok')).focus();
  });
}

// ---- Talking to the Google Sheet ----
function ApiError(code) {
  this.code = code;
}
async function api(action, payload) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), REQUEST_TIMEOUT_MS);
  try {
    // Sent as plain text on purpose: Google's script addresses reject the extra check browsers make for JSON.
    const response = await fetch(SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify(Object.assign({ code: accessCode, action }, payload)),
      signal: controller.signal
    });
    const data = await response.json();
    if (!data.ok) throw new ApiError(data.error);
    return data;
  } catch (e) {
    throw e instanceof ApiError ? e : new ApiError('network');
  } finally {
    clearTimeout(timer);
  }
}
function errorMessage(err, name) {
  const values = { name: name || t('thisPerson') };
  switch (err.code) {
    case 'pin': return t('errPin', values);
    case 'locked': return t('errLocked', values);
    case 'no-person': return t('errNoPerson', values);
    case 'network': return t('errNetworkSave');
    case 'setup': return t('errSetup');
    case 'invalid': return t('errInvalid');
    default: return t('errServer');
  }
}
function applyData(data) {
  state.people = data.people;
  state.entries = data.entries;
  state.badRows = data.badRows || [];
  state.loaded = true;
  state.loadedAt = Date.now();
  renderNameChoices();
  if (!$('page-week').hidden) renderWeek();
  if (!$('page-settings').hidden) renderSettings();
}
async function refresh() {
  if (loading || saving) return;
  loading = true;
  try {
    applyData(await api('load'));
    $('status-banner').hidden = true;
  } catch (err) {
    if (err.code === 'access') {
      connectAgain();
    } else {
      const shown = state.loaded ? ' ' + t('maybeOutOfDate') : '';
      $('status-text').textContent = (err.code === 'network' ? t('errNetworkLoad') : errorMessage(err)) + shown;
      $('status-banner').hidden = false;
      renderNameChoices();
    }
  } finally {
    loading = false;
  }
}
function connectAgain() {
  accessCode = '';
  writeStored(CODE_KEY, null);
  state = { people: [], entries: [], badRows: [], loaded: false, loadedAt: 0 };
  resetForm();
  $('status-banner').hidden = true;
  showPage('connect');
}
async function connect(event) {
  event.preventDefault();
  const code = $('connect-code').value.trim();
  if (!code) {
    showError('connect-error', t('enterCode'));
    return;
  }
  accessCode = code;
  $('connect-btn').disabled = true;
  showError('connect-error', '');
  try {
    applyData(await api('load'));
    writeStored(CODE_KEY, code);
    $('connect-code').value = '';
    showPage('log');
  } catch (err) {
    accessCode = '';
    showError('connect-error', err.code === 'access' ? t('wrongCode') : t('errNetworkLoad'));
  } finally {
    $('connect-btn').disabled = false;
  }
}

// ---- Pages ----
function showPage(page) {
  ['connect', 'log', 'week', 'settings'].forEach(name => { $('page-' + name).hidden = name !== page; });
  $('main-nav').hidden = page === 'connect';
  document.querySelectorAll('nav button').forEach(btn => {
    if (btn.dataset.page === page) btn.setAttribute('aria-current', 'page');
    else btn.removeAttribute('aria-current');
  });
  if (page === 'log') renderNameChoices();
  if (page === 'week') renderWeek();
  if (page === 'settings') renderSettings();
  window.scrollTo(0, 0);
  if (page !== 'connect' && Date.now() - state.loadedAt > REFRESH_AFTER_MS) refresh();
}

// ---- Log hours ----
function selectedName() {
  const checked = document.querySelector('input[name="person"]:checked');
  return checked ? checked.value : '';
}
function renderNameChoices() {
  const selected = selectedName();
  const editing = editingId ? state.entries.find(e => e.id === editingId) : null;
  // While an entry is open, it can only stay with the person it belongs to.
  const names = editing ? [editing.name] : state.people;
  $('names-message').hidden = names.length > 0;
  $('form-fields').hidden = names.length === 0;
  if (!names.length) {
    $('names-message-text').textContent = t(state.loaded ? 'noNamesSheet' : 'loadingNames');
    $('names-check').hidden = !state.loaded;
  }
  $('name-choices').innerHTML = names.map(name =>
    `<label><input type="radio" name="person" value="${esc(name)}"${name === selected || editing ? ' checked' : ''}><span>${esc(name)}</span></label>`
  ).join('');
}
function updatePreview() {
  const start = $('f-start').value;
  const end = $('f-end').value;
  const hours = $('preview-hours');
  const note = $('preview-note');
  if (!start || !end) {
    hours.textContent = '–';
    note.textContent = t('enterTimes');
    return;
  }
  const worked = shiftMinutes(start, end) - editingBreak;
  hours.textContent = worked > 0 ? t('hoursCount', { hours: fmtHours(worked) }) : '–';
  note.textContent = worked <= 0
    ? t('checkTimes')
    : (toMinutes(end) < toMinutes(start) ? t('endsNextDay') : '');
}
function resetForm() {
  editingId = null;
  editingBreak = 0;
  pendingSave = null;
  $('entry-form').reset();
  // Rebuilt from empty, because reset() alone would put back a name that was drawn as selected.
  $('name-choices').innerHTML = '';
  $('f-date').value = toDateStr(new Date());
  $('log-title').textContent = t('logTitle');
  $('save-btn').textContent = t('saveHours');
  $('cancel-edit').hidden = true;
  showError('form-error', '');
  renderNameChoices();
  updatePreview();
}
function validateEntry(entry, pin) {
  if (!entry.name) return t('chooseName');
  if (!/^\d{4}$/.test(pin)) return t('enterPin');
  if (!entry.date) return t('chooseDate');
  if (!entry.start || !entry.end) return t('enterBothTimes');
  if (entry.start === entry.end) return t('sameTimes');
  if (workedMinutes(entry) <= 0) return t('breakTooLong');
  return '';
}
// Each shift as a span of absolute minutes, so a shift past midnight still compares correctly.
function shiftSpan(entry) {
  const d = parseDate(entry.date);
  const day = Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 60000;
  const from = day + toMinutes(entry.start);
  return [from, from + shiftMinutes(entry.start, entry.end)];
}
function entryWarnings(entry) {
  const warnings = [];
  if (entry.date > toDateStr(new Date())) warnings.push(t('warnFuture'));
  if (workedMinutes(entry) > LONG_SHIFT_MINUTES) warnings.push(t('warnLong', { hours: fmtHours(workedMinutes(entry)) }));
  const [from, to] = shiftSpan(entry);
  const overlap = state.entries.find(other => {
    if (other.id === entry.id || other.name !== entry.name) return false;
    const [otherFrom, otherTo] = shiftSpan(other);
    return from < otherTo && otherFrom < to;
  });
  if (overlap) warnings.push(t('warnOverlap', { name: entry.name, day: fmtDay(parseDate(overlap.date)), start: fmtTime(overlap.start), end: fmtTime(overlap.end) }));
  return warnings;
}
// A dropped connection can hide a save that actually worked. Retrying with the same ID
// updates that row in the Sheet instead of adding a second copy.
function idForSave(name) {
  if (editingId) return editingId;
  if (!pendingSave || pendingSave.name !== name) pendingSave = { id: uid(), name };
  return pendingSave.id;
}
function setSaving(isSaving) {
  saving = isSaving;
  $('save-btn').disabled = isSaving;
  $('cancel-edit').disabled = isSaving;
  $('save-btn').textContent = t(isSaving ? 'saving' : (editingId ? 'saveChanges' : 'saveHours'));
}
async function submitEntry(event) {
  event.preventDefault();
  if (saving) return;
  const name = selectedName();
  const pin = $('f-pin').value.trim();
  const entry = {
    id: idForSave(name),
    name,
    date: $('f-date').value,
    start: $('f-start').value,
    end: $('f-end').value,
    breakMin: editingBreak
  };
  const problem = validateEntry(entry, pin);
  showError('form-error', problem);
  if (problem) return;
  const warnings = entryWarnings(entry);
  if (warnings.length && !await ask(warnings.join('\n\n') + '\n\n' + t('saveAnywayQuestion'), t('saveAnyway'))) return;

  const wasEditing = Boolean(editingId);
  setSaving(true);
  try {
    const data = await api('save', { entry, pin });
    applyData(data);
    $('status-banner').hidden = true;
    setSaving(false);
    toast(t('saved', { hours: fmtHours(workedMinutes(entry)), name }));
    // The name and PIN clear on purpose, so the next person on the shared iPad can't log under the last one.
    resetForm();
    if (wasEditing) {
      viewWeek = weekStartOf(parseDate(entry.date));
      showPage('week');
    }
  } catch (err) {
    setSaving(false);
    if (err.code === 'access') {
      connectAgain();
      return;
    }
    if (err.code === 'pin' || err.code === 'locked') $('f-pin').value = '';
    showError('form-error', errorMessage(err, name));
  }
}
function startEdit(id) {
  const entry = state.entries.find(e => e.id === id);
  if (!entry) return;
  editingId = id;
  editingBreak = entry.breakMin;
  showPage('log');
  $('f-pin').value = '';
  $('f-date').value = entry.date;
  $('f-start').value = entry.start;
  $('f-end').value = entry.end;
  $('log-title').textContent = t('editTitle');
  $('save-btn').textContent = t('saveChanges');
  $('cancel-edit').hidden = false;
  showError('form-error', '');
  updatePreview();
}
async function deleteEntry(id) {
  const entry = state.entries.find(e => e.id === id);
  if (!entry) return;
  const summary = `${entry.name}, ${fmtDay(parseDate(entry.date))}, ${t('timeRange', { start: fmtTime(entry.start), end: fmtTime(entry.end) })}`;
  const pin = await ask(t('deleteQuestion', { summary, name: entry.name }), t('delete'), true);
  if (pin === null) return;
  if (!/^\d{4}$/.test(pin.trim())) {
    await ask(t('deleteNeedsPin'), 'OK');
    return;
  }
  toast(t('deleting'));
  try {
    applyData(await api('delete', { id, pin: pin.trim() }));
    toast(t('deleted'));
  } catch (err) {
    $('toast').hidden = true;
    if (err.code === 'access') {
      connectAgain();
      return;
    }
    // Shown as a pop-up because the entries are far down the page, where a message at the top would go unseen.
    await ask(err.code === 'network' ? t('errNetworkDelete') : errorMessage(err, entry.name), 'OK');
  }
}

// ---- Weekly hours ----
function entriesInWeek(start) {
  const from = toDateStr(start);
  const to = toDateStr(addDays(start, 6));
  return state.entries.filter(e => e.date >= from && e.date <= to).sort(byDateThenTime);
}
// One row per person: everyone on the People tab (so a missing time card stands out), plus anyone removed since who has hours this week.
function weekRows(start, entries) {
  const days = [0, 1, 2, 3, 4, 5, 6].map(i => toDateStr(addDays(start, i)));
  const names = Array.from(new Set(state.people.concat(entries.map(e => e.name))));
  return names.map(name => {
    const own = entries.filter(e => e.name === name);
    const perDay = days.map(day => own.filter(e => e.date === day).reduce((sum, e) => sum + workedMinutes(e), 0));
    return { name, perDay, total: perDay.reduce((a, b) => a + b, 0) };
  }).sort((a, b) => a.name.localeCompare(b.name));
}
function renderWeek() {
  const entries = entriesInWeek(viewWeek);
  const rows = weekRows(viewWeek, entries);
  $('week-title').textContent = fmtRange(viewWeek, t('locale'));
  $('week-now').disabled = toDateStr(viewWeek) === toDateStr(weekStartOf(new Date()));
  $('export-week').disabled = entries.length === 0;
  // iPads on iOS 14 or older can't hand a file from a web page to the share sheet, so the button could only fail there.
  const canSave = !isAppleTablet() || Boolean(navigator.canShare);
  $('export-week').hidden = !canSave;
  $('export-note').hidden = canSave;
  // A row the app can't read would make someone's pay total wrong without this warning.
  showError('week-bad-rows', state.badRows.length ? t('badRows', { rows: state.badRows.join(', ') }) : '');

  if (rows.length === 0) {
    $('week-totals').innerHTML = `<p class="muted">${esc(t(state.loaded ? 'noNames' : 'loadingSheet'))}</p>`;
  } else {
    const heads = [0, 1, 2, 3, 4, 5, 6].map(i => {
      const d = addDays(viewWeek, i);
      return `<th scope="col">${esc(d.toLocaleDateString(t('locale'), { weekday: 'short' }))}<br>${d.getMonth() + 1}/${d.getDate()}</th>`;
    }).join('');
    const cell = minutes => minutes ? `<td>${fmtHours(minutes)}</td>` : '<td class="zero">–</td>';
    const body = rows.map(row =>
      `<tr><td>${esc(row.name)}</td>${row.perDay.map(cell).join('')}<td class="total-col">${fmtHours(row.total)}</td></tr>`
    ).join('');
    const dayTotals = [0, 1, 2, 3, 4, 5, 6].map(i => rows.reduce((sum, row) => sum + row.perDay[i], 0));
    const grand = rows.reduce((sum, row) => sum + row.total, 0);
    $('week-totals').innerHTML = `<table>
      <thead><tr><th scope="col">${esc(t('name'))}</th>${heads}<th scope="col" class="total-col">${esc(t('totalHours'))}</th></tr></thead>
      <tbody>${body}</tbody>
      <tfoot><tr><td>${esc(t('everyone'))}</td>${dayTotals.map(cell).join('')}<td class="total-col">${fmtHours(grand)}</td></tr></tfoot>
    </table>`;
  }

  if (entries.length === 0) {
    $('week-entries').innerHTML = `<p class="muted">${esc(t(state.loaded ? 'noHours' : 'loadingSheet'))}</p>`;
    return;
  }
  let html = '';
  let currentDay = '';
  entries.forEach(entry => {
    if (entry.date !== currentDay) {
      currentDay = entry.date;
      html += `<h3 class="day-title">${esc(fmtDay(parseDate(entry.date)))}</h3>`;
    }
    const breakNote = entry.breakMin ? t('minBreak', { minutes: entry.breakMin }) : '';
    const nextDay = toMinutes(entry.end) < toMinutes(entry.start) ? t('nextDay') : '';
    html += `<div class="entry">
      <div class="entry-main">
        <div class="entry-name">${esc(entry.name)}</div>
        <div class="muted">${esc(t('timeRange', { start: fmtTime(entry.start), end: fmtTime(entry.end) }))}${esc(nextDay)}${esc(breakNote)}</div>
      </div>
      <div class="entry-hours">${fmtHours(workedMinutes(entry))} ${esc(t('hrs'))}</div>
      <div class="entry-actions">
        <button type="button" class="btn small" data-edit="${esc(entry.id)}">${esc(t('edit'))}</button>
        <button type="button" class="btn small danger" data-delete="${esc(entry.id)}">${esc(t('delete'))}</button>
      </div>
    </div>`;
  });
  $('week-entries').innerHTML = html;
}

// ---- Spreadsheet file ----
function csvCell(value) {
  let text = String(value);
  // A leading = + - or @ would make Excel treat a typed name as a formula.
  if (/^[=+\-@\t\r]/.test(text)) text = "'" + text;
  return '"' + text.replace(/"/g, '""') + '"';
}
function weekCsv(start) {
  const entries = entriesInWeek(start);
  const rows = weekRows(start, entries);
  const lines = [
    ['Fantasy Lighting time card'],
    ['Week', fmtRange(start, 'en-US')],
    [],
    ['Name', 'Total hours'],
    ...rows.map(row => [row.name, fmtHours(row.total)]),
    ['Everyone', fmtHours(rows.reduce((sum, row) => sum + row.total, 0))],
    [],
    ['Name', 'Date', 'Day', 'Start', 'End', 'Break (minutes)', 'Hours'],
    ...entries.map(e => [e.name, e.date, DAY_NAMES[parseDate(e.date).getDay()], fmtTime(e.start), fmtTime(e.end), e.breakMin, fmtHours(workedMinutes(e))])
  ];
  // The leading marker tells Excel the file is UTF-8, so accented names display correctly.
  return '﻿' + lines.map(line => line.map(csvCell).join(',')).join('\r\n') + '\r\n';
}
function isAppleTablet() {
  return /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
}
// Resolves to '' when handled, or to the reason this device couldn't hand over the file.
async function saveFile(filename, text, type) {
  const file = new File([text], filename, { type });
  // Downloads can silently do nothing in a home-screen app, so the iPad only uses its share sheet (Save to Files, AirDrop, Mail).
  if (isAppleTablet()) {
    if (!navigator.share || !navigator.canShare) return 'no share support';
    let problem = 'file type refused';
    // Some iPads refuse a spreadsheet file type but accept the same file sent as plain text.
    for (const candidate of [file, new File([text], filename, { type: 'text/plain' })]) {
      if (!navigator.canShare({ files: [candidate] })) continue;
      try {
        await navigator.share({ files: [candidate] });
        return '';
      } catch (e) {
        if (e.name === 'AbortError') return '';
        problem = e.name;
      }
    }
    return problem;
  }
  const url = URL.createObjectURL(file);
  const link = document.createElement('a');
  link.href = url;
  link.download = filename;
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
  return '';
}

// ---- Settings ----
function renderSettings() {
  $('people-summary').textContent = state.people.length
    ? t('onTheList', { names: state.people.join(', ') })
    : t(state.loaded ? 'noNames' : 'loadingSheet');
  // November 1, 2026 is a Sunday, so counting from it gives the day names in order.
  $('week-start').innerHTML = DAY_NAMES.map((name, i) => {
    const label = new Date(2026, 10, 1 + i).toLocaleDateString(t('locale'), { weekday: 'long' });
    return `<option value="${i}"${i === weekStart ? ' selected' : ''}>${esc(label)}</option>`;
  }).join('');
}

// ---- Wiring ----
document.addEventListener('click', event => {
  const target = event.target.closest('button');
  if (!target) return;
  if (target.dataset.page) showPage(target.dataset.page);
  else if (target.dataset.edit) startEdit(target.dataset.edit);
  else if (target.dataset.delete) deleteEntry(target.dataset.delete);
});
$('lang-btn').addEventListener('click', () => {
  lang = lang === 'en' ? 'es' : 'en';
  writeStored(LANG_KEY, lang);
  applyLanguage();
});
$('connect-form').addEventListener('submit', connect);
$('entry-form').addEventListener('submit', submitEntry);
$('entry-form').addEventListener('input', updatePreview);
$('names-check').addEventListener('click', refresh);
$('status-retry').addEventListener('click', refresh);
$('cancel-edit').addEventListener('click', () => {
  const entry = state.entries.find(e => e.id === editingId);
  resetForm();
  if (entry) viewWeek = weekStartOf(parseDate(entry.date));
  showPage('week');
});
$('week-prev').addEventListener('click', () => { viewWeek = addDays(viewWeek, -7); renderWeek(); });
$('week-next').addEventListener('click', () => { viewWeek = addDays(viewWeek, 7); renderWeek(); });
$('week-now').addEventListener('click', () => { viewWeek = weekStartOf(new Date()); renderWeek(); });
$('export-week').addEventListener('click', async () => {
  const problem = await saveFile(`fantasy-lighting-hours-${toDateStr(viewWeek)}.csv`, weekCsv(viewWeek), 'text/csv');
  if (problem) await ask(t('exportFailed', { problem }), 'OK');
});
$('week-start').addEventListener('change', event => {
  weekStart = Number(event.target.value);
  writeStored(WEEK_START_KEY, String(weekStart));
  viewWeek = weekStartOf(new Date());
});
$('disconnect-btn').addEventListener('click', async () => {
  if (await ask(t('disconnectQuestion'), t('disconnect'))) connectAgain();
});
// The iPad may stay open for days, so returning brings in fresh hours, and on a new day moves an untouched form and the week view to today.
document.addEventListener('visibilitychange', () => {
  if (document.hidden || !accessCode) return;
  const today = toDateStr(new Date());
  if (today !== lastSeenDay) {
    lastSeenDay = today;
    viewWeek = weekStartOf(new Date());
    if (!editingId && !selectedName() && !$('f-start').value && !$('f-end').value) $('f-date').value = today;
    if (!$('page-week').hidden) renderWeek();
  }
  if (Date.now() - state.loadedAt > REFRESH_AFTER_MS) refresh();
});

// A flex column with a 1px gap between empty items is 1px tall only where flexbox gap works.
(function detectFlexGap() {
  const probe = document.createElement('div');
  probe.style.cssText = 'display:flex;flex-direction:column;row-gap:1px;position:absolute';
  probe.innerHTML = '<div></div><div></div>';
  document.body.appendChild(probe);
  if (probe.scrollHeight !== 1) document.documentElement.classList.add('no-flex-gap');
  document.body.removeChild(probe);
})();

if (readStored(LANG_KEY) === 'es') lang = 'es';
const savedWeekStart = Number(readStored(WEEK_START_KEY));
if (Number.isInteger(savedWeekStart) && savedWeekStart >= 0 && savedWeekStart <= 6) weekStart = savedWeekStart;
accessCode = readStored(CODE_KEY) || '';
lastSeenDay = toDateStr(new Date());
viewWeek = weekStartOf(new Date());
resetForm();
applyLanguage();
if (!SCRIPT_URL) {
  $('connect-missing').hidden = false;
  $('connect-form').hidden = true;
  showPage('connect');
} else if (!accessCode) {
  showPage('connect');
} else {
  showPage('log');
}
</script>
